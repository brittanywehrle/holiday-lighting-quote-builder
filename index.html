<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wehrle Quote Builder</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1613">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wehrle Quotes">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/noto-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <svg width="46" height="26" viewBox="0 0 160 90" aria-hidden="true"><polyline points="20,70 80,20 140,70" fill="none" stroke="#5E6F68" stroke-width="3"/><g fill="#FFD58A"><circle cx="20" cy="70" r="7"/><circle cx="44" cy="50" r="7"/><circle cx="68" cy="30" r="7"/><circle cx="80" cy="20" r="7"/><circle cx="92" cy="30" r="7"/><circle cx="116" cy="50" r="7"/><circle cx="140" cy="70" r="7"/></g></svg>
      <div><b>WEHRLE</b><small>QUOTE BUILDER</small></div>
    </div>
    <span class="jobname" id="jobname"></span>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-view="jobs" aria-current="page">Jobs</button>
      <button class="tab" data-view="trace" disabled>Trace</button>
      <button class="tab" data-view="quote" disabled>Quote</button>
      <button class="tab" data-view="proposal" disabled>Proposal</button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
  </header>
  <main>
    <section class="page" id="v-jobs"></section>

    <section class="page" id="v-trace" hidden>
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="House photo. Tap to place points, drag to move around, pinch to zoom."></canvas>
        <div class="optchip" id="optchip" hidden></div>
      </div>
      <aside class="side" aria-label="Tracing tools">
        <div id="opt-panel"></div>
        <div>
          <h2>View</h2>
          <div class="seg" id="seg-mode"><button data-mode="day">Day · tracing</button><button data-mode="night">Night · mockup</button></div>
        </div>
        <div>
          <h2>Tools</h2>
          <div class="tools" id="tools">
            <button class="tool" data-tool="select"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6z"/></svg>Select</button>
            <button class="tool" data-tool="scale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="20" height="8" rx="1.5"/><path d="M6 8v3M10 8v4M14 8v3M18 8v4"/></svg>Scale</button>
            <button class="tool" data-tool="c9"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 18L12 6l10 12"/><circle cx="7" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="6" r="1.6" fill="currentColor"/><circle cx="17" cy="12" r="1.6" fill="currentColor"/></svg>C9 lights</button>
            <button class="tool" data-tool="garland"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M2 8c3 6 7 6 10 0s7-6 10 0"/></svg>Garland</button>
            <button class="tool" data-tool="window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16M4 12h16"/></svg>Window</button>
            <button class="tool" data-tool="wreath"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="11" r="6.5"/><path d="M10 18l-2 4M14 18l2 4" stroke-width="2"/></svg>Wreath</button>
          </div>
          <p class="hint" id="hint"></p>
          <div class="row" id="draft-actions" hidden>
            <button class="btn primary" id="btn-finish">Finish line</button>
            <button class="btn" id="btn-cancel">Cancel</button>
          </div>
          <div id="scale-form" hidden>
            <label class="f" for="scale-ft">Real length of what you tapped (feet)</label>
            <div class="row" style="margin-top:6px">
              <input id="scale-ft" type="number" inputmode="decimal" step="0.5" min="1" value="16" style="max-width:110px">
              <button class="btn primary" id="btn-set-scale">Set scale</button>
              <button class="btn" id="btn-cancel-scale">Cancel</button>
            </div>
          </div>
        </div>
        <div id="sel-props" hidden></div>
        <div>
          <h2>Lights</h2>
          <div class="seg" id="seg-color"><button data-color="warm">Warm white</button><button data-color="multi">Multicolor</button></div>
          <div class="seg" id="seg-spacing" style="margin-top:8px"><button data-spacing="12">12″ spacing</button><button data-spacing="15">15″ spacing</button></div>
        </div>
        <div>
          <h2>Measured</h2>
          <div class="totals" id="totals"></div>
        </div>
        <div class="row">
          <button class="btn small" id="btn-undo">Undo</button>
          <button class="btn small" id="btn-fit">Fit photo</button>
          <label class="btn small" for="photo-replace">Replace photo</label>
          <input type="file" id="photo-replace" accept="image/*" hidden>
        </div>
      </aside>
    </section>

    <section class="page" id="v-quote" hidden></section>
    <section class="page" id="v-proposal" hidden></section>
    <section class="page" id="v-settings" hidden></section>
  </main>
  <div id="toast" role="status" hidden></div>
  <div id="sharebar" class="sharebar" role="status" hidden><span><b>Ready to share:</b> <span id="sharebar-name"></span></span><button class="btn primary small" id="sharebar-go">Share</button><button class="btn small" id="sharebar-x">Dismiss</button></div>
</div>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
